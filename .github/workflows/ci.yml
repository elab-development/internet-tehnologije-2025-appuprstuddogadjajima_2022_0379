name: CI

on:
  push:
  pull_request:

jobs:
  laravel-tests:
    name: Laravel tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "iteh code/eventapi"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, tokenizer, json, bcmath, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: php artisan test --compact
