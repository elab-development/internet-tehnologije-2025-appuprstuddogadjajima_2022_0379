
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: eventovi
      MYSQL_USER: eventhub
      MYSQL_PASSWORD: eventhubpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ./eventapi
      dockerfile: Dockerfile
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: base64:2fl+pTnzuFmjmsIes/jZ7PPiAMm5Wj6ZgGY6+X/YQFk=
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: eventovi
      DB_USERNAME: eventhub
      DB_PASSWORD: eventhubpass
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    ports:
      - "8000:8000"
    volumes:
      - ./eventapi:/var/www/html
      - ./eventapi/.env.docker:/var/www/html/.env:ro
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./eventfront
      dockerfile: Dockerfile
    environment:
      HOST: "0.0.0.0"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./eventfront:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
  backend_vendor:
  frontend_node_modules:
